name: Build Driver Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 project
        run: unzip -q Truck-Tracking-Command-Center-V3.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Driver APK
        working-directory: Truck-Tracking-Command-Center-V3/driver-android
        run: gradle assembleDebug --stacktrace

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Tracker-Driver-APK
          path: Truck-Tracking-Command-Center-V3/driver-android/app/build/outputs/apk/debug/app-debug.apk
