 name: Build Driver Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Driver APK
        working-directory: driver-android
        run: gradle assembleDebug

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: Truck-Tracker-Driver-APK
          path: driver-android/app/build/outputs/apk/debug/app-debug.apk
